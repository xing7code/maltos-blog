<text x="380.0" y="297" text-anchor="middle" font-size="10" fill="#5f625f">a second all-to-all sends each result home (inverse routing)</text>
<rect x="40" y="315" width="680" height="34" rx="6" fill="#f5f7f4" stroke="#d8dcd6" stroke-width="1"/>
<text x="380.0" y="331" text-anchor="middle" font-size="10.5" fill="#141414">4 all-to-alls per MoE layer per step  &#183;  2 forward (dispatch + return) + 2 in backward</text>
<text x="380.0" y="344" text-anchor="middle" font-size="10" fill="#5f625f">communication volume &#8733; (token count &#215; hidden dim), independent of the number of experts</text>
