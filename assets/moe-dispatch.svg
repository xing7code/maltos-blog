<text x="380.0" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">Expert parallelism: all-to-all regroups tokens by destination</text>
<text x="380.0" y="49" text-anchor="middle" font-size="11" fill="#5f625f">color = the expert-rank each token is bound for (4 ranks, 8 experts, 2 experts per rank)</text>
<text x="153.0" y="78" text-anchor="middle" font-size="11.5" font-weight="700" fill="#141414">Before dispatch</text>
<text x="153.0" y="286" text-anchor="middle" font-size="10" fill="#5f625f">every rank holds tokens for all experts</text>
<text x="607.0" y="78" text-anchor="middle" font-size="11.5" font-weight="700" fill="#141414">After dispatch</text>
<text x="607.0" y="286" text-anchor="middle" font-size="10" fill="#5f625f">each rank holds only its experts&#39; tokens</text>
