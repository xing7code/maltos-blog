<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .subtitle { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .panelhead { font: 800 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .label { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1e293b; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .note { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
      .code { font: 600 12px "JetBrains Mono", ui-monospace, monospace; fill: #1e293b; }
      .pct { font: 800 14px "JetBrains Mono", ui-monospace, monospace; fill: white; }
      .pctd { font: 800 14px "JetBrains Mono", ui-monospace, monospace; fill: #0f172a; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="28" fill="#f8fafc"/>
  <text x="60" y="56" class="title">Two Communication Regimes, From rank-0 Traces</text>
  <text x="60" y="82" class="subtitle">GPU kernel time by class, three steady-state ProfilerStep windows. Percentages are GPU kernel durations only (CPU-side time nests too much to attribute).</text>

  <!-- ===== Case A panel ===== -->
  <rect x="40" y="110" width="540" height="410" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="68" y="148" class="panelhead">Case A — dense ZeRO-3</text>
  <text x="68" y="172" class="small">DP=8 · 654 all-gathers/step · the step IS the communication</text>

  <!-- Stacked horizontal bar: total width 484 from x=68 -->
  <!-- AG 68.1% -> 330px ; RS 27.4% -> 133px ; GEMM 2.9% -> 14px ; other 1.6% -> 7px -->
  <rect x="68" y="190" width="330" height="34" rx="4" fill="#2563eb"/>
  <text x="76" y="212" class="pct">AG 68.1%</text>
  <rect x="398" y="190" width="133" height="34" fill="#7c3aed"/>
  <text x="406" y="212" class="pct">RS 27.4%</text>
  <rect x="531" y="190" width="14" height="34" fill="#16a34a"/>
  <rect x="545" y="190" width="7" height="34" rx="4" fill="#94a3b8"/>
  <text x="68" y="244" class="note">NCCL = 95.5% of GPU kernel time · GEMM 2.9% · other 1.6%</text>

  <!-- detail table -->
  <text x="68" y="278" class="label">all-gather</text>
  <text x="260" y="278" class="code" text-anchor="end">654/step</text>
  <text x="512" y="278" class="code" text-anchor="end">avg 23.8 ms</text>
  <line x1="68" y1="288" x2="552" y2="288" stroke="#e2e8f0"/>
  <text x="68" y="310" class="label">reduce-scatter</text>
  <text x="260" y="310" class="code" text-anchor="end">219/step</text>
  <text x="512" y="310" class="code" text-anchor="end">avg 28.6 ms · f32</text>
  <line x1="68" y1="320" x2="552" y2="320" stroke="#e2e8f0"/>
  <text x="68" y="342" class="label">GEMM (model math)</text>
  <text x="260" y="342" class="code" text-anchor="end">771/step</text>
  <text x="512" y="342" class="code" text-anchor="end">4.7% of wall</text>

  <rect x="68" y="368" width="484" height="130" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="84" y="394" class="label" fill="#b91c1c">Diagnosis: communication-shaped, not -heavy</text>
  <text x="84" y="418" class="note">654×23.8ms + 219×28.6ms ≈ 21.8 s ≈ the 21.9 s step.</text>
  <text x="84" y="438" class="note">~220 buckets: every Linear AND every RMSNorm gets its own</text>
  <text x="84" y="455" class="note">8-rank PCIe collective. A 4 KB norm weight pays the same as</text>
  <text x="84" y="472" class="note">a 34 MB MLP matrix → latency-bound, RING_LL, wire mostly idle.</text>
  <text x="84" y="490" class="code" fill="#b91c1c">fix: coarsen wrap_cls to decoder-layer granularity</text>

  <!-- ===== Case E panel ===== -->
  <rect x="620" y="110" width="540" height="410" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="648" y="148" class="panelhead">Case E — PP+TP+ZeRO-3</text>
  <text x="648" y="172" class="small">DP=2,PP=2,TP=2 · same NCCL share, different composition</text>

  <!-- AG 39.8% -> 193px ; P2P 27.7% -> 134px ; RS 17.6% -> 85px ; GEMM 9.9% -> 48px ; other 5% -> 24px ; total 484 -->
  <rect x="648" y="190" width="193" height="34" rx="4" fill="#2563eb"/>
  <text x="656" y="212" class="pct">AG 39.8%</text>
  <rect x="841" y="190" width="134" height="34" fill="#dc2626"/>
  <text x="849" y="212" class="pct">P2P 27.7%</text>
  <rect x="975" y="190" width="85" height="34" fill="#7c3aed"/>
  <text x="983" y="212" class="pct">RS 17.6%</text>
  <rect x="1060" y="190" width="48" height="34" fill="#16a34a"/>
  <rect x="1108" y="190" width="24" height="34" rx="4" fill="#94a3b8"/>
  <text x="648" y="244" class="note">NCCL = 85% · GEMM up to 9.9% · P2P = pipeline stage waits</text>

  <text x="648" y="278" class="label">all-gather</text>
  <text x="840" y="278" class="code" text-anchor="end">532/step</text>
  <text x="1092" y="278" class="code" text-anchor="end">avg 9.7 ms</text>
  <line x1="648" y1="288" x2="1132" y2="288" stroke="#e2e8f0"/>
  <text x="648" y="310" class="label">P2P send/recv</text>
  <text x="840" y="310" class="code" text-anchor="end">4/step</text>
  <text x="1092" y="310" class="code" text-anchor="end">avg 894 ms</text>
  <line x1="648" y1="320" x2="1132" y2="320" stroke="#e2e8f0"/>
  <text x="648" y="342" class="label">reduce-scatter</text>
  <text x="840" y="342" class="code" text-anchor="end">266/step</text>
  <text x="1092" y="342" class="code" text-anchor="end">avg 8.5 ms</text>

  <rect x="648" y="368" width="484" height="130" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="664" y="394" class="label" fill="#6d28d9">Diagnosis: two strategies pulling apart</text>
  <text x="664" y="418" class="note">894 ms P2P kernels = stages waiting (≈3.6 s/step is bubble).</text>
  <text x="664" y="438" class="note">Halving the model per stage barely cut the all-gather count</text>
  <text x="664" y="455" class="note">(654→532): ZeRO-3 re-materializes params PER microbatch, so</text>
  <text x="664" y="472" class="note">PP's M multiplies the exact comm that PP needs M to grow.</text>
  <text x="664" y="490" class="code" fill="#6d28d9">fix: keep params alive across microbatches, then raise M</text>
</svg>
