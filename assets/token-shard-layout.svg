<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="280" fill="#fff"/>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#5f625f"/>
    </marker>
  </defs>

  <!-- ── SECTION 1: Shard files on disk ── -->
  <text x="16" y="20" font-size="12" font-weight="600" fill="#141414">On disk: binary token shards</text>

  <!-- shard file boxes -->
  <rect x="16"  y="28" width="100" height="34" rx="4" fill="#f7f7f4" stroke="#c9cbc2" stroke-width="1.5"/>
  <text x="66"  y="45" text-anchor="middle" font-size="11" font-weight="600" fill="#141414">shard_000.bin</text>
  <text x="66"  y="57" text-anchor="middle" font-size="10" fill="#5f625f">~400 MB</text>

  <rect x="126" y="28" width="100" height="34" rx="4" fill="#f7f7f4" stroke="#c9cbc2" stroke-width="1.5"/>
  <text x="176" y="45" text-anchor="middle" font-size="11" font-weight="600" fill="#141414">shard_001.bin</text>
  <text x="176" y="57" text-anchor="middle" font-size="10" fill="#5f625f">~400 MB</text>

  <rect x="236" y="28" width="100" height="34" rx="4" fill="#f7f7f4" stroke="#c9cbc2" stroke-width="1.5"/>
  <text x="286" y="45" text-anchor="middle" font-size="11" font-weight="600" fill="#141414">shard_002.bin</text>
  <text x="286" y="57" text-anchor="middle" font-size="10" fill="#5f625f">~400 MB</text>

  <text x="350" y="49" font-size="18" fill="#c9cbc2">···</text>

  <!-- dtype note -->
  <text x="395" y="38" font-size="10" fill="#5f625f">uint32 tokens,</text>
  <text x="395" y="52" font-size="10" fill="#5f625f">packed as binary</text>
  <text x="395" y="62" font-size="10" fill="#5f625f">numpy arrays</text>

  <!-- memmap arrow -->
  <line x1="380" y1="90" x2="380" y2="110" stroke="#5f625f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="396" y="103" font-size="10" fill="#5f625f">numpy.memmap  (no copy)</text>

  <!-- ── SECTION 2: Token stream ── -->
  <text x="16" y="126" font-size="12" font-weight="600" fill="#141414">In memory: virtual concatenated token stream</text>

  <!-- token stream bar -->
  <rect x="16" y="132" width="728" height="24" rx="3" fill="#f7f7f4" stroke="#c9cbc2" stroke-width="1"/>
  <text x="380" y="148" text-anchor="middle" font-size="11" fill="#5f625f">t₀  t₁  t₂  t₃  t₄  t₅  t₆  t₇  t₈  t₉  t₁₀  t₁₁  t₁₂  t₁₃  ···  t_N</text>

  <!-- shard boundaries -->
  <line x1="200" y1="132" x2="200" y2="156" stroke="#c9cbc2" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="382" y1="132" x2="382" y2="156" stroke="#c9cbc2" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="562" y1="132" x2="562" y2="156" stroke="#c9cbc2" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ── SECTION 3: DP rank windows ── -->
  <text x="16" y="174" font-size="12" font-weight="600" fill="#141414">DP windowing: each rank reads a non-overlapping slice</text>

  <!-- rank colors: teal variants -->
  <!-- rank 0 window -->
  <rect x="16"  y="182" width="181" height="22" rx="3" fill="#0f766e" opacity="0.85"/>
  <text x="107" y="196" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Rank 0 · offset = 0</text>

  <!-- rank 1 window -->
  <rect x="198" y="182" width="183" height="22" rx="3" fill="#0b4f4a" opacity="0.85"/>
  <text x="290" y="196" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Rank 1 · offset = T/4</text>

  <!-- rank 2 window -->
  <rect x="382" y="182" width="180" height="22" rx="3" fill="#0f766e" opacity="0.65"/>
  <text x="472" y="196" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Rank 2 · offset = T/2</text>

  <!-- rank 3 window -->
  <rect x="563" y="182" width="181" height="22" rx="3" fill="#0b4f4a" opacity="0.65"/>
  <text x="653" y="196" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Rank 3 · offset = 3T/4</text>

  <!-- arrows showing advancing cursor -->
  <line x1="16"  y1="208" x2="195" y2="208" stroke="#0f766e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="198" y1="208" x2="378" y2="208" stroke="#0b4f4a" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="382" y1="208" x2="560" y2="208" stroke="#0f766e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="563" y1="208" x2="741" y2="208" stroke="#0b4f4a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="16" y="220" font-size="10" fill="#5f625f">cursor advances by (seq_len+1) each step</text>

  <!-- ── SECTION 4: T+1 convention ── -->
  <rect x="16" y="232" width="728" height="38" rx="4" fill="#f7f7f4" stroke="#c9cbc2" stroke-width="1"/>
  <text x="24" y="248" font-size="11" font-weight="600" fill="#141414">The +1 convention:</text>
  <text x="148" y="248" font-size="11" fill="#5f625f">read seq_len+1 tokens  →  input_ids = tokens[0:T],  labels = tokens[1:T+1]</text>
  <text x="24" y="263" font-size="10" fill="#5f625f">labels[i] = the token the model must predict at position i.  Each window consumes T+1 raw tokens from the stream.</text>
</svg>
