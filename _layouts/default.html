<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    {% include theme_script.html %}
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Primary">
        <a class="brand" href="{{ '/' | relative_url }}">
          <img class="brand-mark" src="{{ "/assets/maltos-wordmark.svg" | relative_url }}" alt="{{ site.title }}">
        </a>
        <div class="nav-links">
          <a class="nav-button" href="https://github.com/xing7code/maltos">GitHub</a>
        </div>
      </nav>
    </header>

    {{ content }}

    <footer class="site-footer">
      <div class="footer-inner">
        <span>{{ site.title }}</span>
        <span>Readable infrastructure notes for fast research.</span>
      </div>
    </footer>
  </body>
</html>
