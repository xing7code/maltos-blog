<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .subtitle { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .label { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .code { font: 600 11px "JetBrains Mono", "Fira Code", ui-monospace, monospace; fill: #1e293b; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .note { font: 500 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
      .edge { stroke: #334155; stroke-width: 1.8; stroke-linecap: round; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L9 5 L2 8 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>
  <text x="60" y="60" class="title">Checkpoint Layout: Files, Manifest, and Atomic Protocol</text>
  <text x="60" y="86" class="subtitle">Each rank writes its own shards; rank 0 assembles the manifest. Rename makes the operation atomic.</text>

  <!-- Directory structure -->
  <text x="60" y="120" class="label">Checkpoint directory (step_5000/)</text>

  <!-- manifest.json box -->
  <rect x="60" y="134" width="440" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="158" class="label" text-anchor="middle">manifest.json  (written by rank 0)</text>
  <text x="80" y="178" class="code">{ "version": 1, "world_size": 4,</text>
  <text x="80" y="195" class="code">  "optimizer_source_ranks": [0, 0, 2, 2],</text>
  <text x="80" y="212" class="code">  "ranks": [</text>
  <text x="80" y="229" class="code">    { "rank": 0, "entries": [</text>
  <text x="80" y="246" class="code">      { "state_key": "zero3_bucket_0",</text>
  <text x="80" y="263" class="code">        "logical_names": ["layers.0.mlp.fc1.weight"],</text>
  <text x="80" y="280" class="code">        "plugin_annotations": { ... } } ]},</text>
  <text x="80" y="297" class="code">  ...  ],  "artifacts": [ ... ] }</text>
  <text x="80" y="316" class="note">optimizer_source_ranks: rank i loads optimizer from rank optimizer_source_ranks[i]</text>
  <text x="80" y="330" class="note">This allows ZeRO-3 optimizer shards to survive topology changes (world size changes not yet supported)</text>

  <!-- Per-rank files -->
  <!-- Rank 0 -->
  <rect x="530" y="134" width="140" height="200" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="158" class="label" text-anchor="middle">rank 0</text>
  <text x="600" y="178" class="code" text-anchor="middle">model_rank_0.pt</text>
  <text x="600" y="194" class="note" text-anchor="middle">sharded params</text>
  <text x="600" y="218" class="code" text-anchor="middle">optim_rank_0.pt</text>
  <text x="600" y="234" class="note" text-anchor="middle">Adam state for</text>
  <text x="600" y="248" class="note" text-anchor="middle">ranks 0 and 1</text>
  <text x="600" y="272" class="code" text-anchor="middle">trainer_rank_0.pt</text>
  <text x="600" y="288" class="note" text-anchor="middle">step, data cursor,</text>
  <text x="600" y="302" class="note" text-anchor="middle">rng state, scheduler</text>

  <!-- Rank 1 -->
  <rect x="690" y="134" width="140" height="200" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760" y="158" class="label" text-anchor="middle">rank 1</text>
  <text x="760" y="178" class="code" text-anchor="middle">model_rank_1.pt</text>
  <text x="760" y="194" class="note" text-anchor="middle">sharded params</text>
  <text x="760" y="218" class="code" text-anchor="middle">(no optim file)</text>
  <text x="760" y="234" class="note" text-anchor="middle">loads from rank 0</text>
  <text x="760" y="258" class="code" text-anchor="middle">trainer_rank_1.pt</text>

  <!-- Rank 2 -->
  <rect x="850" y="134" width="140" height="200" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="158" class="label" text-anchor="middle">rank 2</text>
  <text x="920" y="178" class="code" text-anchor="middle">model_rank_2.pt</text>
  <text x="920" y="194" class="note" text-anchor="middle">sharded params</text>
  <text x="920" y="218" class="code" text-anchor="middle">optim_rank_2.pt</text>
  <text x="920" y="234" class="note" text-anchor="middle">Adam state for</text>
  <text x="920" y="248" class="note" text-anchor="middle">ranks 2 and 3</text>
  <text x="920" y="272" class="code" text-anchor="middle">trainer_rank_2.pt</text>

  <!-- Rank 3 -->
  <rect x="1010" y="134" width="150" height="200" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1085" y="158" class="label" text-anchor="middle">rank 3</text>
  <text x="1085" y="178" class="code" text-anchor="middle">model_rank_3.pt</text>
  <text x="1085" y="194" class="note" text-anchor="middle">sharded params</text>
  <text x="1085" y="218" class="code" text-anchor="middle">(no optim file)</text>
  <text x="1085" y="234" class="note" text-anchor="middle">loads from rank 2</text>
  <text x="1085" y="258" class="code" text-anchor="middle">trainer_rank_3.pt</text>

  <!-- Atomic write protocol -->
  <rect x="60" y="360" width="1100" height="130" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="610" y="386" class="label" text-anchor="middle">Atomic Write Protocol</text>

  <!-- 3 steps inline -->
  <rect x="90" y="400" width="300" height="56" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="420" class="small" text-anchor="middle">① All ranks write to step_5000.tmp/</text>
  <text x="240" y="438" class="note" text-anchor="middle">parallel writes, no coordination</text>
  <text x="240" y="453" class="note" text-anchor="middle">rank 0 also writes manifest.json</text>

  <line x1="390" y1="428" x2="415" y2="428" class="edge"/>

  <rect x="415" y="400" width="300" height="56" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="565" y="420" class="small" text-anchor="middle">② distributed_barrier()</text>
  <text x="565" y="438" class="note" text-anchor="middle">all ranks confirm writes done</text>
  <text x="565" y="453" class="note" text-anchor="middle">before any rename</text>

  <line x1="715" y1="428" x2="740" y2="428" class="edge"/>

  <rect x="740" y="400" width="380" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="930" y="420" class="small" text-anchor="middle">③ rank 0 renames .tmp/ → step_5000/</text>
  <text x="930" y="438" class="note" text-anchor="middle">atomic at filesystem level (POSIX rename)</text>
  <text x="930" y="453" class="note" text-anchor="middle">reader sees full checkpoint or nothing</text>
</svg>
