<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .subtitle { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .label { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .phase { font: 500 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
      .edge { stroke: #334155; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L9 5 L2 8 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="460" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="title">5 Surfaces Where Parallelism Strategies Must Coordinate</text>
  <text x="60" y="88" class="subtitle">Each surface is a failure mode if handled naively. The plugin protocol gives every strategy a home at each one.</text>

  <!-- Surface 1: Model Transformation (blue) -->
  <rect x="40" y="120" width="204" height="280" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="142" y="154" class="label" text-anchor="middle">Model</text>
  <text x="142" y="172" class="label" text-anchor="middle">Transformation</text>
  <text x="142" y="205" class="small" text-anchor="middle">TP shards weight</text>
  <text x="142" y="221" class="small" text-anchor="middle">columns. ZeRO-3</text>
  <text x="142" y="237" class="small" text-anchor="middle">wraps every param.</text>
  <text x="142" y="253" class="small" text-anchor="middle">SP swaps attn impl.</text>
  <text x="142" y="279" class="small" text-anchor="middle">Order matters: ZeRO-3</text>
  <text x="142" y="295" class="small" text-anchor="middle">must wrap after TP.</text>
  <rect x="60" y="345" width="164" height="30" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
  <text x="142" y="365" class="phase" text-anchor="middle">TRANSFORM_MODEL phase</text>

  <!-- Surface 2: Gradient Reduction (purple) -->
  <rect x="264" y="120" width="204" height="280" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="366" y="154" class="label" text-anchor="middle">Gradient</text>
  <text x="366" y="172" class="label" text-anchor="middle">Reduction</text>
  <text x="366" y="205" class="small" text-anchor="middle">DDP all-reduces over</text>
  <text x="366" y="221" class="small" text-anchor="middle">DP group. ZeRO-3</text>
  <text x="366" y="237" class="small" text-anchor="middle">reduce-scatters. CP</text>
  <text x="366" y="253" class="small" text-anchor="middle">and EP need a post-</text>
  <text x="366" y="269" class="small" text-anchor="middle">reduce callback before</text>
  <text x="366" y="285" class="small" text-anchor="middle">the optimizer sees grads.</text>
  <rect x="284" y="345" width="164" height="30" rx="8" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="366" y="365" class="phase" text-anchor="middle">POST_BACKWARD callback</text>

  <!-- Surface 3: Optimizer Ownership (orange) -->
  <rect x="488" y="120" width="204" height="280" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="590" y="154" class="label" text-anchor="middle">Optimizer</text>
  <text x="590" y="172" class="label" text-anchor="middle">Ownership</text>
  <text x="590" y="205" class="small" text-anchor="middle">ZeRO-1/2/3 own the</text>
  <text x="590" y="221" class="small" text-anchor="middle">optimizer. Plain DDP</text>
  <text x="590" y="237" class="small" text-anchor="middle">does not. Exactly one</text>
  <text x="590" y="253" class="small" text-anchor="middle">plugin may declare</text>
  <text x="590" y="269" class="small" text-anchor="middle">owns_optimizer=True.</text>
  <text x="590" y="285" class="small" text-anchor="middle">Factory deferred until</text>
  <text x="590" y="301" class="small" text-anchor="middle">all transforms done.</text>
  <rect x="508" y="345" width="164" height="30" rx="8" fill="#ea580c" fill-opacity="0.12" stroke="#ea580c" stroke-width="1.5"/>
  <text x="590" y="365" class="phase" text-anchor="middle">PRE_STEP / POST_STEP</text>

  <!-- Surface 4: Checkpoint Layout (green) -->
  <rect x="712" y="120" width="204" height="280" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="814" y="154" class="label" text-anchor="middle">Checkpoint</text>
  <text x="814" y="172" class="label" text-anchor="middle">Layout</text>
  <text x="814" y="205" class="small" text-anchor="middle">TP shards parameters</text>
  <text x="814" y="221" class="small" text-anchor="middle">across ranks. ZeRO-3</text>
  <text x="814" y="237" class="small" text-anchor="middle">shards optimizer state.</text>
  <text x="814" y="253" class="small" text-anchor="middle">Manifest records which</text>
  <text x="814" y="269" class="small" text-anchor="middle">rank wrote what, so</text>
  <text x="814" y="285" class="small" text-anchor="middle">resume is exact even</text>
  <text x="814" y="301" class="small" text-anchor="middle">under topology change.</text>
  <rect x="732" y="345" width="164" height="30" rx="8" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.5"/>
  <text x="814" y="365" class="phase" text-anchor="middle">PRE_SAVE / POST_LOAD</text>

  <!-- Surface 5: Token Metrics (teal) -->
  <rect x="936" y="120" width="204" height="280" rx="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="1038" y="154" class="label" text-anchor="middle">Token</text>
  <text x="1038" y="172" class="label" text-anchor="middle">Metric Counting</text>
  <text x="1038" y="205" class="small" text-anchor="middle">SP shards sequence.</text>
  <text x="1038" y="221" class="small" text-anchor="middle">Raw token count in</text>
  <text x="1038" y="237" class="small" text-anchor="middle">loss is per-rank, not</text>
  <text x="1038" y="253" class="small" text-anchor="middle">global. Multiply by</text>
  <text x="1038" y="269" class="small" text-anchor="middle">SP world size before</text>
  <text x="1038" y="285" class="small" text-anchor="middle">logging throughput or</text>
  <text x="1038" y="301" class="small" text-anchor="middle">computing MFU.</text>
  <rect x="956" y="345" width="164" height="30" rx="8" fill="#0f766e" fill-opacity="0.12" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1038" y="365" class="phase" text-anchor="middle">POST_STEP logging</text>

  <!-- Bottom label -->
  <text x="600" y="430" class="subtitle" text-anchor="middle">Each surface is owned by a runtime phase. Plugins hook into phases — they never call each other directly.</text>
</svg>
