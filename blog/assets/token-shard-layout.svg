<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .subtitle { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .label { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .code { font: 600 12px "JetBrains Mono", "Fira Code", ui-monospace, monospace; fill: #1e293b; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .note { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
      .edge { stroke: #334155; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L9 5 L2 8 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="28" fill="#f8fafc"/>
  <text x="60" y="60" class="title">Token Shards, Windows, and DP Partitioning</text>
  <text x="60" y="86" class="subtitle">Each training window consumes seq_len+1 raw tokens. DP ranks take interleaved non-overlapping slices.</text>

  <!-- Shard files row -->
  <text x="60" y="126" class="label">Disk: flat binary shards (uint32 token IDs)</text>
  <rect x="60" y="138" width="200" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="160" class="code" text-anchor="middle">shard_000000.bin</text>
  <text x="160" y="180" class="note" text-anchor="middle">100M tokens · 400MB</text>

  <rect x="280" y="138" width="200" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="160" class="code" text-anchor="middle">shard_000001.bin</text>
  <text x="380" y="180" class="note" text-anchor="middle">100M tokens · 400MB</text>

  <rect x="500" y="138" width="200" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="160" class="code" text-anchor="middle">shard_000002.bin</text>
  <text x="600" y="180" class="note" text-anchor="middle">100M tokens · 400MB</text>

  <text x="730" y="172" class="label">···</text>

  <rect x="780" y="138" width="200" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="160" class="code" text-anchor="middle">shard_000099.bin</text>
  <text x="880" y="180" class="note" text-anchor="middle">100M tokens · 400MB</text>

  <!-- Arrow: shards -> stream -->
  <line x1="600" y1="194" x2="600" y2="225" class="edge"/>
  <text x="620" y="218" class="note">numpy.memmap</text>

  <!-- Token stream bar -->
  <text x="60" y="250" class="label">Memory-mapped token stream (virtual concatenation)</text>
  <rect x="60" y="260" width="1080" height="36" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="90" y="283" class="code">t₀  t₁  t₂  t₃  t₄  t₅  t₆  t₇  t₈  t₉  t₁₀ t₁₁ t₁₂ t₁₃ t₁₄ t₁₅ t₁₆ t₁₇ t₁₈ t₁₉  ···</text>

  <!-- Arrow: stream -> DP ranks -->
  <line x1="600" y1="296" x2="600" y2="320" class="edge"/>

  <!-- DP partitioning - seq_len=5 for illustration -->
  <text x="60" y="346" class="label">DP-aware windowing (seq_len=5, dp_world_size=3, each window=seq_len+1=6 tokens)</text>

  <!-- Rank 0 windows -->
  <rect x="60" y="358" width="126" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="123" y="379" class="code" text-anchor="middle">t₀ t₁ t₂ t₃ t₄ t₅</text>
  <text x="123" y="397" class="note" text-anchor="middle">rank 0, window 0</text>

  <!-- Rank 1 windows -->
  <rect x="206" y="358" width="126" height="52" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="269" y="379" class="code" text-anchor="middle">t₆ t₇ t₈ t₉ t₁₀ t₁₁</text>
  <text x="269" y="397" class="note" text-anchor="middle">rank 1, window 0</text>

  <!-- Rank 2 windows -->
  <rect x="352" y="358" width="126" height="52" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="415" y="379" class="code" text-anchor="middle">t₁₂ ··· t₁₇</text>
  <text x="415" y="397" class="note" text-anchor="middle">rank 2, window 0</text>

  <!-- Next windows -->
  <rect x="498" y="358" width="126" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="561" y="379" class="code" text-anchor="middle">t₁₈ ··· t₂₃</text>
  <text x="561" y="397" class="note" text-anchor="middle">rank 0, window 1</text>

  <rect x="644" y="358" width="126" height="52" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="707" y="379" class="code" text-anchor="middle">t₂₄ ··· t₂₉</text>
  <text x="707" y="397" class="note" text-anchor="middle">rank 1, window 1</text>

  <rect x="790" y="358" width="126" height="52" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="853" y="379" class="code" text-anchor="middle">t₃₀ ··· t₃₅</text>
  <text x="853" y="397" class="note" text-anchor="middle">rank 2, window 1</text>

  <text x="960" y="388" class="label">···</text>

  <!-- Bottom notes -->
  <text x="60" y="444" class="note">• input_ids = window[0:seq_len],  labels = window[1:seq_len+1]  (the +1 convention)</text>
  <text x="60" y="462" class="note">• All DP ranks together cover every token exactly once per global step — no gaps, no repeats</text>
  <text x="60" y="480" class="note">• Checkpoint saves (shard_idx, token_offset) per rank — restoring it reproduces the exact token sequence</text>
</svg>
