<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .subtitle { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .label { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .code { font: 600 12px "JetBrains Mono", "Fira Code", ui-monospace, monospace; fill: #1e293b; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .note { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
      .mem { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #059669; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="28" fill="#f8fafc"/>
  <text x="60" y="60" class="title">ZeRO Stages: What Each Stage Shards</text>
  <text x="60" y="86" class="subtitle">For a 7B-parameter model with AdamW on N=8 GPUs. All values approximate (bf16 params + fp32 Adam moments).</text>

  <!-- Header row -->
  <rect x="40" y="110" width="140" height="36" rx="8" fill="#334155"/>
  <text x="110" y="133" class="label" text-anchor="middle" fill="white">Stage</text>
  <rect x="192" y="110" width="200" height="36" rx="8" fill="#334155"/>
  <text x="292" y="133" class="label" text-anchor="middle" fill="white">Sharded across DP</text>
  <rect x="404" y="110" width="320" height="36" rx="8" fill="#334155"/>
  <text x="564" y="133" class="label" text-anchor="middle" fill="white">Per-rank memory (7B, N=8)</text>
  <rect x="736" y="110" width="420" height="36" rx="8" fill="#334155"/>
  <text x="946" y="133" class="label" text-anchor="middle" fill="white">Communication cost vs. DDP</text>

  <!-- No ZeRO row -->
  <rect x="40" y="158" width="140" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="182" class="label" text-anchor="middle">No ZeRO</text>
  <text x="110" y="200" class="note" text-anchor="middle">(plain DDP)</text>
  <rect x="192" y="158" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="292" y="182" class="small" text-anchor="middle">nothing</text>
  <text x="292" y="198" class="note" text-anchor="middle">full copy on every rank</text>
  <rect x="404" y="158" width="320" height="56" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="564" y="179" class="code" text-anchor="middle">~84 GB per rank</text>
  <text x="564" y="196" class="note" text-anchor="middle">2B params + 4B m + 4B v + 2B grad (bytes)</text>
  <text x="564" y="212" class="note" text-anchor="middle">= 12 bytes/param × 7B params</text>
  <rect x="736" y="158" width="420" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="946" y="182" class="small" text-anchor="middle">all-reduce grads (baseline)</text>
  <text x="946" y="198" class="note" text-anchor="middle">2× model size per all-reduce</text>

  <!-- ZeRO-1 row -->
  <rect x="40" y="226" width="140" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="250" class="label" text-anchor="middle">ZeRO-1</text>
  <text x="110" y="267" class="note" text-anchor="middle">owns_optimizer</text>
  <rect x="192" y="226" width="200" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="292" y="248" class="small" text-anchor="middle">optimizer state</text>
  <text x="292" y="264" class="note" text-anchor="middle">m, v (fp32) per rank</text>
  <text x="292" y="277" class="note" text-anchor="middle">handles N/N params</text>
  <rect x="404" y="226" width="320" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="564" y="247" class="code" text-anchor="middle">~42 GB per rank</text>
  <text x="564" y="263" class="note" text-anchor="middle">params + grads replicated; moments sharded</text>
  <text x="564" y="278" class="note" text-anchor="middle">2B + (8B/8) = 3B bytes/param</text>
  <rect x="736" y="226" width="420" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="946" y="248" class="small" text-anchor="middle">all-reduce grads + all-gather params after step</text>
  <text x="946" y="264" class="note" text-anchor="middle">same comm as DDP (all-reduce grads is dominant)</text>

  <!-- ZeRO-2 row -->
  <rect x="40" y="294" width="140" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="318" class="label" text-anchor="middle">ZeRO-2</text>
  <text x="110" y="335" class="note" text-anchor="middle">owns_optimizer</text>
  <rect x="192" y="294" width="200" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="292" y="316" class="small" text-anchor="middle">optimizer state + gradients</text>
  <text x="292" y="332" class="note" text-anchor="middle">m, v, and grad per rank</text>
  <text x="292" y="346" class="note" text-anchor="middle">handles N/N params</text>
  <rect x="404" y="294" width="320" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="564" y="314" class="code" text-anchor="middle">~28 GB per rank</text>
  <text x="564" y="330" class="note" text-anchor="middle">params replicated; grad + moments sharded</text>
  <text x="564" y="345" class="note" text-anchor="middle">2B + (2B+8B)/8 = 3.25B bytes/param</text>
  <rect x="736" y="294" width="420" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="946" y="314" class="small" text-anchor="middle">reduce-scatter grads + all-gather params after step</text>
  <text x="946" y="330" class="note" text-anchor="middle">same total volume as DDP but different pattern</text>

  <!-- ZeRO-3 row -->
  <rect x="40" y="362" width="140" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="386" class="label" text-anchor="middle">ZeRO-3</text>
  <text x="110" y="402" class="note" text-anchor="middle">owns_optimizer</text>
  <rect x="192" y="362" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="292" y="383" class="small" text-anchor="middle">everything: params,</text>
  <text x="292" y="399" class="small" text-anchor="middle">gradients, optimizer state</text>
  <text x="292" y="413" class="note" text-anchor="middle">each rank owns N/N params</text>
  <rect x="404" y="362" width="320" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="564" y="382" class="code" text-anchor="middle">~12 GB per rank  (÷8 vs DDP)</text>
  <text x="564" y="398" class="note" text-anchor="middle">(2B + 2B + 8B) / 8 = 1.5B bytes/param</text>
  <text x="564" y="414" class="note" text-anchor="middle">plus activation memory per layer</text>
  <rect x="736" y="362" width="420" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="946" y="382" class="small" text-anchor="middle">all-gather params (fwd + bwd) + reduce-scatter grads</text>
  <text x="946" y="398" class="note" text-anchor="middle">3× model size per step — higher comm, much lower memory</text>
  <text x="946" y="414" class="note" text-anchor="middle">prefetch overlaps all-gather with compute</text>

  <text x="60" y="466" class="note">* ZeRO-3 trades memory for communication volume. Profitable when memory is the binding constraint, not bandwidth.</text>
  <text x="60" y="483" class="note">* In MALTOS, ZeRO-3 wraps modules (default: nn.Linear) so all-gather happens at module boundaries, enabling prefetch.</text>
</svg>
