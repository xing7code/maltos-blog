<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #fcfbf7; }
      .panel { fill: #fffdfa; stroke: #d8d2c7; stroke-width: 1.5; }
      .title { font: 700 28px Georgia, "Times New Roman", serif; fill: #171717; }
      .subtitle { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5f5a52; }
      .panel-title { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #171717; }
      .label { font: 700 13px "JetBrains Mono", "Fira Code", ui-monospace, monospace; fill: #374151; }
      .legend { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #4b5563; }
      .note { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="620" rx="24"/>
  <text x="48" y="54" class="title">Naive ZeRO-3 vs. Prefetching</text>
  <text x="48" y="80" class="subtitle">Horizontal axis is time. Prefetching overlaps the next all-gather under the current layer's compute.</text>

  <rect x="48" y="108" width="1104" height="40" rx="12" class="panel"/>
  <rect x="76" y="120" width="24" height="14" rx="5" fill="#f8d7a7" stroke="#d19a3e"/>
  <text x="110" y="132" class="legend">all-gather</text>
  <rect x="230" y="120" width="32" height="14" rx="5" fill="#b9d4ff" stroke="#5b8def"/>
  <text x="272" y="132" class="legend">compute</text>

  <!-- Naive panel -->
  <rect x="48" y="172" width="1104" height="180" rx="18" class="panel"/>
  <text x="72" y="202" class="panel-title">Naive: gather, then compute, then move to the next layer</text>
  <line x1="212" y1="226" x2="1108" y2="226" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="72" y="230" class="legend">time</text>

  <text x="72" y="258" class="label">layer 0</text>
  <rect x="212" y="244" width="96" height="24" rx="8" fill="#f8d7a7" stroke="#d19a3e"/>
  <rect x="308" y="244" width="176" height="24" rx="8" fill="#b9d4ff" stroke="#5b8def"/>

  <text x="72" y="292" class="label">layer 1</text>
  <rect x="484" y="278" width="96" height="24" rx="8" fill="#f8d7a7" stroke="#d19a3e"/>
  <rect x="580" y="278" width="176" height="24" rx="8" fill="#b9d4ff" stroke="#5b8def"/>

  <text x="72" y="326" class="label">layer 2</text>
  <rect x="756" y="312" width="96" height="24" rx="8" fill="#f8d7a7" stroke="#d19a3e"/>
  <rect x="852" y="312" width="176" height="24" rx="8" fill="#b9d4ff" stroke="#5b8def"/>

  <text x="72" y="374" class="note">The next layer cannot start gathering until the current layer finishes computing.</text>

  <!-- Prefetch panel -->
  <rect x="48" y="388" width="1104" height="180" rx="18" class="panel"/>
  <text x="72" y="418" class="panel-title">Prefetch: gather layer L+1 while layer L is still computing</text>
  <line x1="212" y1="442" x2="1108" y2="442" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="72" y="446" class="legend">time</text>

  <text x="72" y="474" class="label">layer 0</text>
  <rect x="212" y="460" width="96" height="24" rx="8" fill="#f8d7a7" stroke="#d19a3e"/>
  <rect x="308" y="460" width="176" height="24" rx="8" fill="#b9d4ff" stroke="#5b8def"/>

  <text x="72" y="508" class="label">layer 1</text>
  <rect x="388" y="494" width="96" height="24" rx="8" fill="#f8d7a7" stroke="#d19a3e"/>
  <rect x="484" y="494" width="176" height="24" rx="8" fill="#b9d4ff" stroke="#5b8def"/>

  <text x="72" y="542" class="label">layer 2</text>
  <rect x="564" y="528" width="96" height="24" rx="8" fill="#f8d7a7" stroke="#d19a3e"/>
  <rect x="660" y="528" width="176" height="24" rx="8" fill="#b9d4ff" stroke="#5b8def"/>

  <text x="72" y="584" class="note">If all-gather fits under compute, much of the communication latency disappears from the critical path.</text>
</svg>
