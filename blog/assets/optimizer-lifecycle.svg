<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .subtitle { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .label { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .code { font: 600 12px "JetBrains Mono", "Fira Code", ui-monospace, monospace; fill: #1e293b; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .note { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
      .warn { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #b91c1c; }
      .edge { stroke: #334155; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L9 5 L2 8 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="28" fill="#f8fafc"/>
  <text x="60" y="60" class="title">Optimizer Lifecycle Under Sharding</text>
  <text x="60" y="86" class="subtitle">The factory pattern defers optimizer construction until all model transforms are complete — preventing silent failures.</text>

  <!-- Timeline header -->
  <line x1="60" y1="115" x2="1140" y2="115" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60" y="108" class="note">time →</text>

  <!-- Phase 1: Plugin registration -->
  <rect x="60" y="128" width="150" height="76" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="152" class="label" text-anchor="middle">1. Register</text>
  <text x="135" y="170" class="code" text-anchor="middle">plugins = [</text>
  <text x="135" y="187" class="code" text-anchor="middle">  TP, ZeRO3, ...]</text>

  <line x1="210" y1="166" x2="240" y2="166" class="edge"/>

  <!-- Phase 2: setup -->
  <rect x="240" y="128" width="150" height="76" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="315" y="148" class="label" text-anchor="middle">2. SETUP</text>
  <text x="315" y="166" class="small" text-anchor="middle">mesh, process</text>
  <text x="315" y="183" class="small" text-anchor="middle">groups created</text>

  <line x1="390" y1="166" x2="420" y2="166" class="edge"/>

  <!-- Phase 3: transform_model (critical!) -->
  <rect x="420" y="118" width="200" height="96" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="520" y="142" class="label" text-anchor="middle">3. TRANSFORM_MODEL</text>
  <text x="520" y="160" class="small" text-anchor="middle">TP: shard weights by column/row</text>
  <text x="520" y="178" class="small" text-anchor="middle">ZeRO-3: wrap each module,</text>
  <text x="520" y="195" class="small" text-anchor="middle">replace params with shards</text>

  <line x1="620" y1="166" x2="650" y2="166" class="edge"/>

  <!-- Phase 4: optimizer factory called -->
  <rect x="650" y="118" width="200" height="96" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="750" y="142" class="label" text-anchor="middle">4. Factory called</text>
  <text x="750" y="162" class="small" text-anchor="middle">create_optimizer(params)</text>
  <text x="750" y="180" class="small" text-anchor="middle">params are now the final</text>
  <text x="750" y="198" class="small" text-anchor="middle">sharded/wrapped set</text>

  <line x1="850" y1="166" x2="880" y2="166" class="edge"/>

  <!-- Phase 5: training loop -->
  <rect x="880" y="128" width="260" height="76" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010" y="148" class="label" text-anchor="middle">5. Training loop</text>
  <text x="1010" y="166" class="small" text-anchor="middle">plugin.on_phase(PRE_STEP)</text>
  <text x="1010" y="183" class="small" text-anchor="middle">plugin owns optimizer.step()</text>

  <!-- Danger zone: naive approach -->
  <rect x="60" y="240" width="1080" height="100" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="600" y="268" class="warn" text-anchor="middle">❌  What goes wrong without the factory pattern</text>
  <text x="600" y="292" class="small" text-anchor="middle">If you construct the optimizer at plugin init time (before TRANSFORM_MODEL), it holds references to the pre-transform parameters.</text>
  <text x="600" y="313" class="small" text-anchor="middle">After ZeRO-3 wraps the model, the original nn.Parameter objects are replaced by shards. The optimizer's param groups still</text>
  <text x="600" y="332" class="small" text-anchor="middle">point to the original (now detached) tensors. Parameter updates happen on ghost tensors — loss decreases, but nothing is trained.</text>

  <!-- Factory pattern benefit -->
  <rect x="60" y="358" width="520" height="90" rx="14" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="320" y="382" class="label" text-anchor="middle">✓  Factory pattern (MALTOS)</text>
  <text x="320" y="402" class="small" text-anchor="middle">runtime.create_optimizer(params) is a deferred call.</text>
  <text x="320" y="421" class="small" text-anchor="middle">Zero3Plugin calls it inside transform_model(), after all param</text>
  <text x="320" y="440" class="small" text-anchor="middle">replacements, with the final local_param shards as inputs.</text>

  <!-- Single owner rule -->
  <rect x="600" y="358" width="540" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="870" y="382" class="label" text-anchor="middle">✓  Single owner enforcement</text>
  <text x="870" y="402" class="small" text-anchor="middle">owns_optimizer=True may only be set by one plugin.</text>
  <text x="870" y="421" class="small" text-anchor="middle">RuntimeCore._validate_optimizer_owner() raises on conflict.</text>
  <text x="870" y="440" class="small" text-anchor="middle">ZeRO-3 and DDP cannot both own the optimizer.</text>
</svg>
