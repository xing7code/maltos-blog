<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .subtitle { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .card-title { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .card-note { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .lane { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 600 12px "JetBrains Mono", "Fira Code", ui-monospace, monospace; fill: #0f172a; }
      .axis-label { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .callout-strong { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #065f46; }
      .callout-soft { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #7c2d12; }
      .callout-mid { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5b21b6; }
      .axis { stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); }
      .divider { stroke: #e2e8f0; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L9 5 L2 8 Z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>

  <text x="60" y="62" class="title">DDP Gradient Reduction Timelines</text>
  <text x="60" y="90" class="subtitle">Same backward pass, three communication strategies: no overlap, per-parameter overlap, and bucketed overlap.</text>

  <line x1="300" y1="122" x2="1120" y2="122" class="axis"/>
  <text x="1082" y="110" class="axis-label">time</text>

  <rect x="40" y="150" width="1120" height="170" rx="20" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="68" y="188" class="card-title">1. Post-backward sync</text>
  <text x="68" y="210" class="card-note">Correct and simple, but communication starts only after backward finishes.</text>

  <text x="68" y="246" class="lane">Backward</text>
  <text x="68" y="286" class="lane">Network</text>

  <rect x="300" y="228" width="100" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="420" y="228" width="100" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="540" y="228" width="100" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="660" y="228" width="100" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="247" class="small" text-anchor="middle">bwd p3</text>
  <text x="470" y="247" class="small" text-anchor="middle">bwd p2</text>
  <text x="590" y="247" class="small" text-anchor="middle">bwd p1</text>
  <text x="710" y="247" class="small" text-anchor="middle">bwd p0</text>

  <rect x="820" y="268" width="68" height="30" rx="8" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="898" y="268" width="68" height="30" rx="8" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="976" y="268" width="68" height="30" rx="8" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="1054" y="268" width="68" height="30" rx="8" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="854" y="287" class="small" text-anchor="middle">AR p3</text>
  <text x="932" y="287" class="small" text-anchor="middle">AR p2</text>
  <text x="1010" y="287" class="small" text-anchor="middle">AR p1</text>
  <text x="1088" y="287" class="small" text-anchor="middle">AR p0</text>

  <line x1="780" y1="220" x2="780" y2="306" class="divider"/>
  <text x="822" y="236" class="callout-soft">No overlap: GPU finishes backward, then waits for AR calls.</text>

  <rect x="40" y="340" width="1120" height="170" rx="20" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="68" y="378" class="card-title">2. Per-parameter async</text>
  <text x="68" y="400" class="card-note">Launch AR as soon as each gradient is ready, so communication overlaps with later backward work.</text>

  <text x="68" y="436" class="lane">Backward</text>
  <text x="68" y="476" class="lane">Network</text>

  <rect x="300" y="418" width="100" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="420" y="418" width="100" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="540" y="418" width="100" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="660" y="418" width="100" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="437" class="small" text-anchor="middle">bwd p3</text>
  <text x="470" y="437" class="small" text-anchor="middle">bwd p2</text>
  <text x="590" y="437" class="small" text-anchor="middle">bwd p1</text>
  <text x="710" y="437" class="small" text-anchor="middle">bwd p0</text>

  <rect x="370" y="458" width="120" height="30" rx="8" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="490" y="458" width="120" height="30" rx="8" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="610" y="458" width="120" height="30" rx="8" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="730" y="458" width="120" height="30" rx="8" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="430" y="477" class="small" text-anchor="middle">AR p3</text>
  <text x="550" y="477" class="small" text-anchor="middle">AR p2</text>
  <text x="670" y="477" class="small" text-anchor="middle">AR p1</text>
  <text x="790" y="477" class="small" text-anchor="middle">AR p0</text>

  <text x="870" y="436" class="callout-mid">Overlap starts early.</text>
  <text x="870" y="458" class="callout-mid">Still one AR per parameter.</text>
  <text x="870" y="480" class="callout-mid">Large models create many tiny NCCL ops.</text>

  <rect x="40" y="530" width="1120" height="190" rx="20" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="68" y="568" class="card-title">3. Bucketed async</text>
  <text x="68" y="590" class="card-note">Keep the overlap idea, but batch many gradients into a flat buffer before launching AR.</text>

  <text x="68" y="626" class="lane">Backward</text>
  <text x="68" y="666" class="lane">Bucket fill</text>
  <text x="68" y="706" class="lane">Network</text>

  <rect x="300" y="608" width="100" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="420" y="608" width="100" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="540" y="608" width="100" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="660" y="608" width="100" height="30" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="627" class="small" text-anchor="middle">bwd p3</text>
  <text x="470" y="627" class="small" text-anchor="middle">bwd p2</text>
  <text x="590" y="627" class="small" text-anchor="middle">bwd p1</text>
  <text x="710" y="627" class="small" text-anchor="middle">bwd p0</text>

  <rect x="370" y="648" width="120" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="490" y="648" width="120" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="610" y="648" width="120" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="730" y="648" width="120" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="667" class="small" text-anchor="middle">p3 -&gt; bucket0</text>
  <text x="550" y="667" class="small" text-anchor="middle">p2 -&gt; bucket0</text>
  <text x="670" y="667" class="small" text-anchor="middle">p1 -&gt; bucket1</text>
  <text x="790" y="667" class="small" text-anchor="middle">p0 -&gt; bucket1</text>

  <rect x="530" y="688" width="170" height="30" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <rect x="770" y="688" width="170" height="30" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text x="615" y="707" class="small" text-anchor="middle">AR bucket0</text>
  <text x="855" y="707" class="small" text-anchor="middle">AR bucket1</text>

  <text x="870" y="626" class="callout-strong">Keeps the overlap from async.</text>
  <text x="870" y="648" class="callout-strong">AR launches per bucket, not per parameter.</text>
  <text x="870" y="670" class="callout-strong">That is why production DDP uses buckets.</text>
</svg>
