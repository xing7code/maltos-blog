<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .subtitle { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .label { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .code { font: 600 12px "JetBrains Mono", "Fira Code", ui-monospace, monospace; fill: #1e293b; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .note { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
      .edge { stroke: #334155; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); fill: none; }
      .comm { stroke: #7c3aed; stroke-width: 2; stroke-linecap: round; fill: none; marker-end: url(#purple-arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L9 5 L2 8 Z" fill="#334155"/>
    </marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L9 5 L2 8 Z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="28" fill="#f8fafc"/>
  <text x="60" y="60" class="title">Tensor Parallelism: ColumnParallel and RowParallel Linear</text>
  <text x="60" y="86" class="subtitle">A transformer MLP block = ColumnParallelLinear → activation → RowParallelLinear. Two ranks, one all-reduce per layer.</text>

  <!-- Left diagram: ColumnParallelLinear -->
  <text x="60" y="122" class="label">ColumnParallelLinear  W:[d_model × d_ffn]  →  split columns</text>

  <!-- Input: replicated across ranks -->
  <rect x="60" y="136" width="120" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="120" y="158" class="small" text-anchor="middle">X  [B, T, d_model]</text>
  <text x="120" y="174" class="note" text-anchor="middle">replicated on all ranks</text>

  <line x1="180" y1="161" x2="220" y2="161" class="edge"/>

  <!-- Rank 0 column half -->
  <rect x="220" y="136" width="140" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="154" class="code" text-anchor="middle">W₀[:, 0:d_ffn/2]</text>
  <text x="290" y="170" class="note" text-anchor="middle">rank 0 columns</text>

  <rect x="220" y="200" width="140" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="218" class="code" text-anchor="middle">W₁[:, d_ffn/2:]</text>
  <text x="290" y="234" class="note" text-anchor="middle">rank 1 columns</text>

  <!-- Output partial -->
  <rect x="390" y="136" width="130" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="455" y="154" class="code" text-anchor="middle">Y₀ [B,T,d_ffn/2]</text>
  <text x="455" y="170" class="note" text-anchor="middle">rank 0 output</text>

  <rect x="390" y="200" width="130" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="455" y="218" class="code" text-anchor="middle">Y₁ [B,T,d_ffn/2]</text>
  <text x="455" y="234" class="note" text-anchor="middle">rank 1 output</text>

  <line x1="360" y1="161" x2="388" y2="161" class="edge"/>
  <line x1="360" y1="225" x2="388" y2="225" class="edge"/>

  <!-- No comm between col and row -->
  <text x="545" y="180" class="note" text-anchor="middle">no all-reduce</text>
  <text x="545" y="196" class="note" text-anchor="middle">↓ activations</text>
  <text x="545" y="212" class="note" text-anchor="middle">stay sharded</text>

  <!-- Divider between the two sections -->
  <line x1="600" y1="120" x2="600" y2="480" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Right diagram: RowParallelLinear -->
  <text x="620" y="122" class="label">RowParallelLinear  W:[d_ffn × d_model]  →  split rows  +  all-reduce</text>

  <!-- Input: already sharded from column layer -->
  <rect x="620" y="136" width="140" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="154" class="code" text-anchor="middle">Y₀ [B,T,d_ffn/2]</text>
  <text x="690" y="170" class="note" text-anchor="middle">rank 0 (from col layer)</text>

  <rect x="620" y="200" width="140" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="218" class="code" text-anchor="middle">Y₁ [B,T,d_ffn/2]</text>
  <text x="690" y="234" class="note" text-anchor="middle">rank 1 (from col layer)</text>

  <!-- Row weight shards -->
  <rect x="790" y="136" width="140" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="154" class="code" text-anchor="middle">W₀[0:d_ffn/2, :]</text>
  <text x="860" y="170" class="note" text-anchor="middle">rank 0 rows</text>

  <rect x="790" y="200" width="140" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="218" class="code" text-anchor="middle">W₁[d_ffn/2:, :]</text>
  <text x="860" y="234" class="note" text-anchor="middle">rank 1 rows</text>

  <line x1="760" y1="161" x2="788" y2="161" class="edge"/>
  <line x1="760" y1="225" x2="788" y2="225" class="edge"/>

  <!-- Partial outputs -->
  <rect x="960" y="136" width="130" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1025" y="154" class="code" text-anchor="middle">Z₀ [B,T,d_model]</text>
  <text x="1025" y="170" class="note" text-anchor="middle">rank 0 partial</text>

  <rect x="960" y="200" width="130" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1025" y="218" class="code" text-anchor="middle">Z₁ [B,T,d_model]</text>
  <text x="1025" y="234" class="note" text-anchor="middle">rank 1 partial</text>

  <line x1="930" y1="161" x2="958" y2="161" class="edge"/>
  <line x1="930" y1="225" x2="958" y2="225" class="edge"/>

  <!-- All-reduce -->
  <rect x="960" y="265" width="130" height="45" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025" y="285" class="small" text-anchor="middle">all_reduce</text>
  <text x="1025" y="302" class="code" text-anchor="middle">Z₀ + Z₁</text>

  <path d="M 1025 186 L 1025 263" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 3" fill="none"/>
  <path d="M 1025 250 L 1025 263" class="comm"/>

  <!-- Full output -->
  <rect x="960" y="328" width="130" height="45" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1025" y="348" class="small" text-anchor="middle">Z [B,T,d_model]</text>
  <text x="1025" y="365" class="note" text-anchor="middle">replicated on all ranks</text>
  <line x1="1025" y1="310" x2="1025" y2="326" class="edge"/>

  <!-- Bottom: Sequence Parallelism note -->
  <rect x="60" y="400" width="1080" height="120" rx="14" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="428" class="label" text-anchor="middle">Sequence Parallelism (SP): what changes</text>
  <text x="600" y="452" class="small" text-anchor="middle">With SP, activations between layers are sharded along the sequence dimension instead of replicated.</text>
  <text x="600" y="472" class="small" text-anchor="middle">ColumnParallel: input scatter (all-to-all) before matmul. RowParallel: all-gather after instead of all-reduce.</text>
  <text x="600" y="492" class="small" text-anchor="middle">The all-reduce in vanilla TP becomes two cheaper all-to-all ops. Memory per rank drops by 1/tp_size for activations.</text>
  <text x="600" y="510" class="note" text-anchor="middle">SP requires seq_len to be divisible by tp_world_size. Implemented as a module-level replacement in TensorParallelPlugin.transform_model()</text>
</svg>
