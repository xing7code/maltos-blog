<svg width="1280" height="750" viewBox="0 0 1280 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .subtitle { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .label { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .body { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .code { font: 700 17px "JetBrains Mono", "Fira Code", ui-monospace, monospace; fill: #0f172a; }
      .codebig { font: 700 19px "JetBrains Mono", "Fira Code", ui-monospace, monospace; fill: #0f172a; }
      .op { font: 700 14px "JetBrains Mono", "Fira Code", ui-monospace, monospace; fill: #7c3aed; }
      .rank { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; letter-spacing: 0.06em; }
      .edge { stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); fill: none; }
      .feed { stroke: #cbd5e1; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 5 4; marker-end: url(#arrow-light); fill: none; }
      .sum { stroke: #7c3aed; stroke-width: 2.6; stroke-linecap: round; marker-end: url(#purple-arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L9 5 L2 8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L9 5 L2 8 Z" fill="#cbd5e1"/>
    </marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L9 5 L2 8 Z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="750" rx="28" fill="#f8fafc"/>
  <text x="60" y="56" class="title">TP Example: y = f(X · W1) · W2</text>
  <text x="60" y="82" class="subtitle">W1 is column-sharded into two 2x1 slices. W2 is row-sharded into two 1x2 slices. Each rank runs an independent branch; results are summed once at the end.</text>

  <!-- ===================== Legend (top, full width) ===================== -->
  <rect x="40" y="100" width="1200" height="70" rx="16" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="64" y="143" class="label">Legend</text>

  <rect x="148" y="116" width="38" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="140" class="body">full tensor</text>

  <rect x="312" y="111" width="24" height="48" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="340" y="123" width="48" height="24" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="402" y="140" class="body">weight shard</text>

  <rect x="540" y="111" width="24" height="48" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="578" y="140" class="body">activation / intermediate</text>

  <circle cx="836" cy="135" r="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="836" y="140" class="op" text-anchor="middle">·</text>
  <text x="854" y="140" class="body">matmul</text>

  <circle cx="968" cy="135" r="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="968" y="140" class="op" text-anchor="middle">f</text>
  <text x="986" y="140" class="body">activation fn</text>

  <circle cx="1124" cy="135" r="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1124" y="140" class="op" text-anchor="middle">+</text>
  <text x="1142" y="140" class="body">all-reduce</text>

  <!-- ===================== Weight-sharding inset (bonus) ===================== -->
  <rect x="40" y="186" width="1200" height="138" rx="20" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="64" y="216" class="label">How the weights are sharded</text>

  <!-- W1: big blue 2x2 square wrapping w11 | w12 (split by columns) -->
  <rect x="378" y="210" width="84" height="84" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="420" y1="214" x2="420" y2="290" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="399" y="257" class="code" text-anchor="middle" style="font-size:14px">w11</text>
  <text x="441" y="257" class="code" text-anchor="middle" style="font-size:14px">w12</text>
  <text x="420" y="312" class="small" text-anchor="middle">W1 = [ w11 | w12 ]  (column-sharded, 2x2)</text>
  <text x="300" y="257" class="codebig" text-anchor="middle">W1</text>
  <text x="344" y="257" class="body" text-anchor="middle">=</text>

  <!-- W2: big green 2x2 square wrapping w21 over w22 (split by rows) -->
  <rect x="838" y="210" width="84" height="84" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2.4"/>
  <line x1="842" y1="252" x2="918" y2="252" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="880" y="240" class="code" text-anchor="middle" style="font-size:14px">w21</text>
  <text x="880" y="278" class="code" text-anchor="middle" style="font-size:14px">w22</text>
  <text x="880" y="312" class="small" text-anchor="middle">W2 = [ w21 / w22 ]  (row-sharded, 2x2)</text>
  <text x="760" y="257" class="codebig" text-anchor="middle">W2</text>
  <text x="804" y="257" class="body" text-anchor="middle">=</text>

  <!-- ===================== Main flow canvas ===================== -->
  <rect x="40" y="330" width="1200" height="400" rx="24" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Shared input X -->
  <rect x="62" y="493" width="86" height="86" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="105" y="533" class="codebig" text-anchor="middle">X</text>
  <text x="105" y="555" class="small" text-anchor="middle">2x2</text>
  <text x="105" y="601" class="small" text-anchor="middle">replicated</text>

  <!-- ============ RANK 0 (top branch) ============ -->
  <text x="200" y="372" class="rank">RANK 0  ·  device 0</text>
  <line x1="190" y1="380" x2="1170" y2="380" stroke="#eef2f7" stroke-width="1.4"/>

  <!-- w11 -->
  <rect x="196" y="388" width="36" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="214" y="492" class="code" text-anchor="middle" style="font-size:15px">w11</text>

  <!-- X feeds into multiply 1 (dashed) -->
  <path d="M148 520 C224 480, 256 452, 288 446" class="feed"/>
  <!-- w11 feeds into multiply 1 -->
  <path d="M232 430 C256 430, 270 438, 288 443" class="edge"/>

  <circle cx="301" cy="444" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="301" y="449" class="op" text-anchor="middle">·</text>

  <path d="M315 444 C338 444, 350 444, 370 444" class="edge"/>

  <!-- z11 -->
  <rect x="370" y="402" width="36" height="84" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="388" y="506" class="code" text-anchor="middle" style="font-size:15px">z11</text>

  <path d="M406 444 C434 444, 454 444, 484 444" class="edge"/>

  <!-- f() -->
  <circle cx="508" cy="444" r="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="508" y="450" class="code" text-anchor="middle" style="font-size:15px; fill:#7c3aed">f()</text>

  <path d="M530 444 C558 444, 578 444, 608 444" class="edge"/>

  <!-- a11 -->
  <rect x="608" y="402" width="36" height="84" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="626" y="506" class="code" text-anchor="middle" style="font-size:15px">a11</text>

  <!-- w21 (wide 1x2 row-shard, same size as the tall shards) above multiply 2 -->
  <rect x="664" y="372" width="84" height="36" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.8"/>
  <text x="706" y="395" class="code" text-anchor="middle" style="font-size:15px">w21</text>

  <!-- a11 feeds right, w21 feeds down, into multiply 2 -->
  <path d="M644 444 C672 444, 690 446, 712 446" class="edge"/>
  <path d="M708 408 C708 420, 712 436, 718 443" class="edge"/>

  <circle cx="732" cy="448" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="732" y="453" class="op" text-anchor="middle">·</text>

  <path d="M746 446 C766 446, 778 446, 798 446" class="edge"/>

  <!-- y1 partial -->
  <rect x="798" y="402" width="86" height="86" rx="14" fill="#fef9c3" stroke="#d97706" stroke-width="1.8"/>
  <text x="841" y="442" class="codebig" text-anchor="middle">y1</text>
  <text x="841" y="464" class="small" text-anchor="middle">2x2 partial</text>

  <!-- ============ RANK 1 (bottom branch) ============ -->
  <text x="200" y="558" class="rank">RANK 1  ·  device 1</text>
  <line x1="190" y1="566" x2="1170" y2="566" stroke="#eef2f7" stroke-width="1.4"/>

  <!-- w12 -->
  <rect x="196" y="612" width="36" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="214" y="714" class="code" text-anchor="middle" style="font-size:15px">w12</text>

  <path d="M148 552 C224 592, 256 624, 288 630" class="feed"/>
  <path d="M232 642 C256 642, 270 634, 288 629" class="edge"/>

  <circle cx="301" cy="628" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="301" y="633" class="op" text-anchor="middle">·</text>

  <path d="M315 628 C338 628, 350 628, 370 628" class="edge"/>

  <rect x="370" y="586" width="36" height="84" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="388" y="688" class="code" text-anchor="middle" style="font-size:15px">z12</text>

  <path d="M406 628 C434 628, 454 628, 484 628" class="edge"/>

  <circle cx="508" cy="628" r="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="508" y="634" class="code" text-anchor="middle" style="font-size:15px; fill:#7c3aed">f()</text>

  <path d="M530 628 C558 628, 578 628, 608 628" class="edge"/>

  <rect x="608" y="586" width="36" height="84" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="626" y="688" class="code" text-anchor="middle" style="font-size:15px">a12</text>

  <!-- w22 (wide 1x2 row-shard) below multiply 2 -->
  <rect x="664" y="666" width="84" height="36" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.8"/>
  <text x="706" y="689" class="code" text-anchor="middle" style="font-size:15px">w22</text>

  <path d="M644 628 C672 628, 690 626, 712 626" class="edge"/>
  <path d="M708 666 C708 654, 712 638, 718 631" class="edge"/>

  <circle cx="732" cy="624" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="732" y="629" class="op" text-anchor="middle">·</text>

  <path d="M746 626 C766 626, 778 626, 798 626" class="edge"/>

  <rect x="798" y="584" width="86" height="86" rx="14" fill="#fef9c3" stroke="#d97706" stroke-width="1.8"/>
  <text x="841" y="624" class="codebig" text-anchor="middle">y2</text>
  <text x="841" y="646" class="small" text-anchor="middle">2x2 partial</text>

  <!-- ============ all-reduce + final y (tightened) ============ -->
  <path d="M884 446 C928 446, 952 520, 980 530" class="sum"/>
  <path d="M884 626 C928 626, 952 552, 980 542" class="sum"/>

  <circle cx="1014" cy="536" r="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="1014" y="544" class="op" text-anchor="middle" style="font-size:24px">+</text>
  <text x="1014" y="592" class="small" text-anchor="middle">all-reduce</text>

  <path d="M1040 536 C1060 536, 1070 536, 1086 536" class="sum"/>

  <rect x="1092" y="493" width="86" height="86" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="1135" y="541" class="codebig" text-anchor="middle">y</text>
  <text x="1135" y="563" class="small" text-anchor="middle">2x2</text>
</svg>
